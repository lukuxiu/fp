<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FP // MATH — 考研数学真题复盘讲义与题库</title>
  <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="rail" id="leftRail">
      <div class="rail-brand">
        <span class="rail-logo">FP // MATH</span>
        <span class="rail-ver">1987–2026</span>
      </div>
      <div class="rail-section-label">NAVIGATION</div>
      <nav class="rail-nav" id="railNav">
        <button class="rail-item active" data-tab="高等数学">∫ 高等数学讲义 (8章)</button>
        <button class="rail-item" data-tab="线性代数">📐 线性代数讲义 (7章)</button>
        <button class="rail-item" data-tab="概率统计">🎲 概率统计讲义 (8章)</button>
        <button class="rail-item" data-tab="knowledge">🗺️ 知识地图 (387考点)</button>
        <button class="rail-item" data-tab="bank">📚 全部真题库 (2,872)</button>
      </nav>
      <div class="rail-chapters" id="railChapters"></div>
    </aside>

    <div class="main-col">
      <header class="maki-topbar">
        <div class="breadcrumb" id="breadcrumb">APP / 复盘讲义 / 高等数学 / 极限</div>
        <div class="topbar-right">
          <div class="exam-pills" id="examPills">
            <button class="exam-pill active" data-exam="all">全部</button>
            <button class="exam-pill" data-exam="数一">数一</button>
            <button class="exam-pill" data-exam="数二">数二</button>
            <button class="exam-pill" data-exam="数三">数三</button>
          </div>
          <button class="kbd-search" id="quickSearchBtn" title="跳转全库搜索 (Ctrl+K)">
            <span>🔍 搜索</span>
            <kbd>Ctrl+K</kbd>
          </button>
          <span class="mastery-pill" id="progressPill">已掌握 0</span>
          <button class="maki-icon-btn" id="themeToggle" title="切换明暗主题">🌓</button>
        </div>
      </header>

      <main class="maki-content" id="appRoot">
        <div class="loading-box">正在加载 2,872 道真题与讲义数据…</div>
      </main>
    </div>
  </div>

  <!-- Maki-style Question Detail Modal -->
  <div class="modal-backdrop hidden" id="qModalBackdrop">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-title-row">
          <span class="modal-title" id="mTitle">题目详情</span>
          <span class="modal-stars" id="mStars"></span>
        </div>
        <button class="maki-icon-btn" id="mCloseBtn" title="关闭">✕</button>
      </div>
      <div class="modal-body" id="mBody"></div>
      <div class="modal-foot">
        <button class="maki-btn" id="mPrevBtn">← 上一题</button>
        <span class="modal-foot-info" id="mFootInfo"></span>
        <button class="maki-btn" id="mNextBtn">下一题 →</button>
      </div>
    </div>
  </div>

  <script src="./vendor/katex/katex.min.js"></script>
  <script src="./vendor/katex/contrib/auto-render.min.js"></script>
  <script src="./data/bundle.js"></script>
  <script src="./app.js"></script>
</body>
</html>
